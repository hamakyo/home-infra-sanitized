---
- name: Check current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: current_tz
  changed_when: false
  check_mode: false

- name: Set system timezone
  ansible.builtin.command: "timedatectl set-timezone {{ infra_timezone }}"
  when: current_tz.stdout | trim != infra_timezone
  changed_when: true

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ infra_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Check if GitHub CLI is installed
  ansible.builtin.command: which gh
  register: gh_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Install GitHub CLI apt keyring and repo when missing
  when: gh_check.rc != 0
  block:
    - name: Download GitHub CLI GPG key
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        mode: "0644"

    - name: Add GitHub CLI apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/github-cli.list
        mode: "0644"
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main

    - name: Install gh package
      ansible.builtin.apt:
        name: gh
        state: present
        update_cache: true

- name: Check if Tailscale is installed
  ansible.builtin.command: which tailscale
  register: tailscale_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Install Tailscale apt repo and package when missing
  when: tailscale_check.rc != 0
  block:
    - name: Download Tailscale GPG key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Add Tailscale apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"
        content: |
          deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main

    - name: Install tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

- name: Ensure tailscaled service is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Deploy SSH hardening configuration
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "sshd -t -f /etc/ssh/sshd_config"
  notify: Reload ssh service

- name: Deploy unattended-upgrades automatic reboot and cleanup policy
  ansible.builtin.template:
    src: 52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"

- name: Ensure unattended-upgrades service is enabled
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Enable net.ipv4.ip_nonlocal_bind for Tailscale reboot resilience
  ansible.builtin.template:
    src: 99-tailscale-nonlocal-bind.conf.j2
    dest: /etc/sysctl.d/99-tailscale-nonlocal-bind.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl settings

- name: Deploy NetworkManager dispatcher tuning for Intel e1000e NIC (EEE/TSO/GSO off)
  ansible.builtin.template:
    src: 99-eno1-e1000e-tuning.j2
    dest: "/etc/NetworkManager/dispatcher.d/99-{{ host_lan_interface }}-e1000e-tuning"
    owner: root
    group: root
    mode: "0755"
  when: infra_e1000e_tuning_enabled | bool
  notify: Apply e1000e NIC tuning

- name: Check current default systemd target
  ansible.builtin.command: systemctl get-default
  register: systemd_default_target
  changed_when: false
  check_mode: false
  when: infra_headless_target | bool

- name: Switch default target to multi-user.target (headless reversible)
  ansible.builtin.command: systemctl set-default multi-user.target
  when:
    - infra_headless_target | bool
    - systemd_default_target.stdout | trim != "multi-user.target"
  changed_when: true

- name: Disable gnome-remote-desktop when present
  ansible.builtin.systemd:
    name: gnome-remote-desktop.service
    enabled: false
    state: stopped
  failed_when: false
  when: infra_headless_target | bool

- name: Configure UFW default policies
  ansible.builtin.command: "ufw default {{ item }}"
  loop:
    - "deny incoming"
    - "allow outgoing"
    - "deny routed"
  register: ufw_default_res
  changed_when: "'Default' in ufw_default_res.stdout and 'unchanged' not in ufw_default_res.stdout"

- name: Configure UFW baseline allow rules (SSH, Caddy HTTPS/QUIC, Zabbix Trapper)
  ansible.builtin.command: "ufw {{ item }}"
  loop:
    - "allow in on tailscale0 to any port 22 proto tcp comment 'SSH Tailscale'"
    - "allow in on {{ host_lan_interface }} from {{ host_lan_cidr }} to any port 22 proto tcp comment 'SSH LAN'"
    - "allow in on tailscale0 to any port 443 proto tcp comment 'Caddy HTTPS Tailscale'"
    - "allow in on tailscale0 to any port 443 proto udp comment 'Caddy HTTP3 Tailscale'"
    - "allow in on tailscale0 to any port 10051 proto tcp comment 'Zabbix Trapper Tailscale'"
  register: ufw_rule_res
  changed_when: "'Skipping adding existing rule' not in ufw_rule_res.stdout"

- name: Check UFW status
  ansible.builtin.command: ufw status
  register: ufw_status
  changed_when: false
  check_mode: false

- name: Enable UFW if inactive
  ansible.builtin.command: ufw --force enable
  when: "'Status: active' not in ufw_status.stdout"
  changed_when: true
