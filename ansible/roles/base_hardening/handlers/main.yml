---
- name: Reload ssh service
  ansible.builtin.systemd:
    name: ssh
    state: reloaded

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Apply e1000e NIC tuning
  ansible.builtin.command: "/etc/NetworkManager/dispatcher.d/99-{{ host_lan_interface }}-e1000e-tuning {{ host_lan_interface }} up"
  changed_when: true
