---
- name: Check if Docker is installed
  ansible.builtin.command: which docker
  register: docker_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Install Docker CE and Compose plugin when missing
  when: docker_check.rc != 0
  block:
    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        mode: "0644"
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable

    - name: Install Docker Engine packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

- name: Add infra user to docker group
  ansible.builtin.user:
    name: "{{ infra_user }}"
    groups: docker
    append: true

- name: Ensure /etc/docker directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configure Docker daemon log rotation
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker service

- name: Ensure docker.service.d drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Ensure Docker starts after tailscaled
  ansible.builtin.template:
    src: 10-after-tailscaled.conf.j2
    dest: /etc/systemd/system/docker.service.d/10-after-tailscaled.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

- name: Ensure docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Check existing external Docker networks
  ansible.builtin.command: "docker network inspect {{ item }}"
  loop: "{{ docker_external_networks }}"
  register: docker_net_checks
  failed_when: false
  changed_when: false
  check_mode: false

- name: Create missing external Docker bridge networks
  ansible.builtin.command: "docker network create --driver bridge {{ item.item }}"
  loop: "{{ docker_net_checks.results }}"
  when: item.rc != 0
  changed_when: true
