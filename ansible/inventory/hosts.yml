---
# DR 用静的インベントリ（NetBox 未稼働のベアメタル復旧時・外部コレクション不要）
# 平時は -i inventory/netbox.yml の NetBox 動的インベントリと併用する
all:
  children:
    infra_hosts:
      hosts:
        ubuntu-desktop:
          ansible_host: 100.64.0.10
          host_tailscale_ip: 100.64.0.10
        # DR 移行先ホストの例（新マシン構築時にコメント解除するか -i / -e で指定）
        # dr-ubuntu:
        #   ansible_host: 100.x.y.z
        #   ansible_user: infra-admin
        #   host_tailscale_ip: 100.x.y.z
        #   host_lan_interface: eth0
        #   host_lan_cidr: 192.168.50.0/24
        #   host_fileserver_enabled: false
