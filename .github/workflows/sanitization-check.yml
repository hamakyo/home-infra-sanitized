name: Sanitization & Secret Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-sanitized:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run sanitization & leakage check
        env:
          EXTRA_FORBIDDEN_REGEX: ${{ secrets.EXTRA_FORBIDDEN_REGEX }}
        run: python3 scripts/check_sanitized.py

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
