[global]
   workgroup = WORKGROUP
   server string = ubuntu-desktop file server
   server role = standalone server

   # Protocol & encryption
   server min protocol = SMB3
   smb encrypt = desired
   # Disable SMB3 multichannel so Samba does not advertise unreachable Docker
   # bridge IPs (172.x.0.1, reported as 10GbE) that stall macOS Finder
   server multi channel support = no

   # Network isolation:
   # tailscale0 is a POINTOPOINT /32 TUN interface skipped by `bind interfaces only = yes`.
   # Enforce isolation via host UFW (445/tcp on eno1 192.168.50.0/24 and tailscale0 only)
   # plus Samba hosts allow/deny (defense in depth; blocks Docker 172.x bridges).
   bind interfaces only = no
   hosts allow = 127.0.0.1 ::1 192.168.50.0/24 100.64.0.0/10 fd7a:115c:a1e0::/48
   hosts deny = ALL

   # Direct SMB over TCP 445 only (no NetBIOS 137-139)
   disable netbios = yes
   smb ports = 445

   # Authentication (no guest, no usershares)
   map to guest = never
   usershare max shares = 0

   # Disable printing
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # Logging
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

   # macOS Finder / iOS Files compatibility
   ea support = yes
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[files]
   comment = Temporary Home File Server (外付け USB SSD 480 GB)
   path = /mnt/files
   browseable = yes
   read only = no
   valid users = infra-admin
   force user = infra-admin
   force group = infra-admin
   create mask = 0640
   directory mask = 0750
   veto files = /lost+found/
