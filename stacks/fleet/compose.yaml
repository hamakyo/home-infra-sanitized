services:
  fleet-mysql:
    image: mysql:8.4
    container_name: fleet-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: fleet
      MYSQL_USER: fleet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: Asia/Tokyo
    volumes:
      - fleet_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fleet-net

  fleet-redis:
    image: redis:7-alpine
    container_name: fleet-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net

  fleet-init:
    image: alpine:3.22
    container_name: fleet-init
    restart: "no"
    command: ["sh", "-c", "chown -R 100:101 /vulndb /logs"]
    volumes:
      - fleet_vulndb:/vulndb
      - fleet_logs:/logs

  fleet:
    image: fleetdm/fleet:v4.95.0
    container_name: fleet
    restart: unless-stopped
    depends_on:
      fleet-mysql:
        condition: service_healthy
      fleet-redis:
        condition: service_healthy
      fleet-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "fleet prepare db --no-prompt && fleet serve"]
    environment:
      FLEET_MYSQL_ADDRESS: fleet-mysql:3306
      FLEET_MYSQL_DATABASE: fleet
      FLEET_MYSQL_USERNAME: fleet
      FLEET_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      FLEET_REDIS_ADDRESS: fleet-redis:6379
      FLEET_SERVER_ADDRESS: 0.0.0.0:8080
      FLEET_SERVER_TLS: "false"
      FLEET_SERVER_PRIVATE_KEY: ${FLEET_SERVER_PRIVATE_KEY:?Set FLEET_SERVER_PRIVATE_KEY in .env}
      FLEET_AUTH_JWT_KEY: ${FLEET_AUTH_JWT_KEY:?Set FLEET_AUTH_JWT_KEY in .env}
      FLEET_VULNERABILITIES_DATABASES_PATH: /vulndb
      FLEET_VULNERABILITIES_PERIODICITY: 1h
      FLEET_VULNERABILITIES_CURRENT_INSTANCE_CHECKS: "yes"
      TZ: Asia/Tokyo
    volumes:
      - fleet_vulndb:/vulndb
      - fleet_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - fleet-net
      - proxy

volumes:
  fleet_mysql_data:
  fleet_vulndb:
  fleet_logs:

networks:
  fleet-net:
    driver: bridge
  proxy:
    external: true
