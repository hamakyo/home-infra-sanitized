apiVersion: 1

datasources:
  - name: Infra DWH
    uid: infra-dwh-pg
    type: postgres
    access: proxy
    url: infra-dwh-postgres:5432
    user: bi_reader
    isDefault: true
    editable: false
    jsonData:
      database: infra_dwh
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ${BI_READER_PASSWORD}
