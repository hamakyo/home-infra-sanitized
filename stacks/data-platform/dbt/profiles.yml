infra_dwh:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('PGHOST', 'infra-dwh-postgres') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'etl_writer') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE', 'infra_dwh') }}"
      schema: stg
      threads: 2
