services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caddy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "${CADDY_BIND_IP:-100.64.0.10}:443:443"
      - "${CADDY_BIND_IP:-100.64.0.10}:443:443/udp"
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:?Set CF_API_TOKEN in .env}
      TZ: Asia/Tokyo
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
      - opencode-proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    name: proxy
    driver: bridge
  opencode-proxy:
    name: opencode-proxy
    driver: bridge
